[build-system]
requires = ["pdm-backend>=2.4.0"]
build-backend = "pdm.backend"

[project]
name = "dataseo-mcp"
version = "0.3.0"
description = "DataSEO MCP provides SEO research tools for backlinks, keywords, traffic, SERP difficulty, competitor analysis, and AI search query planning."
readme = "README.md"
authors = [
    {name = "Ege Bese"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "requests>=2.32.3",
    "pydantic>=2.5.0",
    "pydantic-core>=2.14.0",
    "openai>=1.0.0"
]

[project.scripts]
dataseo-mcp = "seo_mcp.server:main"
seo-mcp = "seo_mcp.server:main"

[project.urls]
"Homepage" = "https://github.com/egebese/dataseo-mcp"
"Bug Tracker" = "https://github.com/egebese/dataseo-mcp/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 92
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "TRY", "RUF"]
ignore = ["S101", "TRY003"]
